for(const name of Object.keys(expandedNotes))el('theme').add(new Option(name,name));
function screen(id){for(const name of ['home','editor','receive'])el(name).hidden=name!==id}
function encode(note){return btoa(Array.from(new TextEncoder().encode(JSON.stringify(note)),n=>String.fromCharCode(n)).join('')).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'')}
function decode(code){if(code.length>4500)throw Error();const bytes=Uint8Array.from(atob(code.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));const n=JSON.parse(new TextDecoder().decode(bytes));if(typeof n.sign!=='string'||n.sign.length>60||!(typeof n.body==='string'&&n.body.trim()&&n.body.length<=400||Object.hasOwn(n.catalog===2?expandedNotes:notes,n.theme)&&Number.isInteger(n.seed)&&n.seed>=0))throw Error();return n}
let note, audio, effectGain, duckTimer;
const ambient=el('ambient');
const sound=el('sound');
const ambientLevel=.19;
let soundEnabled=true;
let soundAttempt=0;
ambient.volume=ambientLevel;
function reflectSound(){
  const playing=soundEnabled&&!ambient.paused;
  sound.setAttribute('aria-pressed',String(playing));
  sound.textContent=playing?'Som ligado':'Ligar som';
}
async function startAmbient(){
  const attempt=++soundAttempt;
  try{
    await ambient.play();
    if(!soundEnabled)ambient.pause();
  }catch{}
  if(attempt===soundAttempt)reflectSound();
}
document.addEventListener('click',event=>{
  if(soundEnabled&&ambient.paused&&!sound.contains(event.target))startAmbient();
},true);
ambient.addEventListener('pause',reflectSound);
function melody(){if(!soundEnabled)return;
ambient.volume=.055;
clearTimeout(duckTimer);
duckTimer=setTimeout(()=>{ambient.volume=ambientLevel},1850);
try{
audio??=new AudioContext();
effectGain?.disconnect();
effectGain=audio.createGain();
effectGain.connect(audio.destination);
audio.resume().catch(()=>{});[523,659,784,659,587,698,880,1047].forEach((hz,i)=>{const t=audio.currentTime+i*.14+(i===7?.55:0),o=audio.createOscillator(),g=audio.createGain();o.type=i===7?'sine':'triangle';o.frequency.value=hz;if(i===7)o.frequency.exponentialRampToValueAtTime(1850,t+.09);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.09,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g).connect(effectGain);o.start(t);o.stop(t+.21)})}catch{}}

el('form').onsubmit=e=>{e.preventDefault();const body=el('body').value;if(el('mode').value==='own'&&!body.trim()){el('body').setCustomValidity('Escreva uma mensagem.');el('body').reportValidity();return}

el('turn').onclick=()=>{

  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

    clearTimeout(fallback);

let noteImage;
function wrappedLines(ctx,text,maxWidth){
  const rows=[];
  for(const paragraph of text.split('\n')){
    let row='';
    for(const word of paragraph.split(' ')){
      const next=row?row+' '+word:word;
      if(ctx.measureText(next).width<=maxWidth){row=next;continue}
      if(row)rows.push(row);
      row='';
      for(const char of word){
        if(row&&ctx.measureText(row+char).width>maxWidth){rows.push(row);row=''}
        row+=char;
      }
    }
    rows.push(row);
  }
  return rows;
}
async function prepareNoteImage(){

    ctx.fillStyle='#e2c68f';
    ctx.font='bold 28px Georgia, serif';
    ctx.fillText('R E A L E J O',216,149);
    ctx.fillRect(96,213,888,1);
    ctx.fillStyle='#f3e6ca';
    ctx.font='49px Georgia, serif';
    rows.forEach((row,i)=>ctx.fillText(row,96,285+i*65));
    ctx.fillStyle='#e2c68f';
    ctx.font='italic 35px Georgia, serif';
    signature.forEach((row,i)=>ctx.fillText(row,96,294+rows.length*65+i*48));
    ctx.font='23px Georgia, serif';
    ctx.fillText('Crie uma notinha e deixe o periquito entregar.',96,canvas.height-91);
    ctx.fillStyle='#d0bd94';
    ctx.font='20px Georgia, serif';
    ctx.fillText(location.host,96,canvas.height-56);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob)throw Error();
    noteImage=new File([blob],'notinha-realejo.png',{type:'image/png'});
    share.disabled=false;
    save.disabled=false;
  }catch{
    el('note-status').textContent='A imagem não ficou disponível. Você ainda pode imprimir o bilhete.';
  }
}
function saveNote(){
  const url=URL.createObjectURL(noteImage);
  const link=document.createElement('a');
  link.href=url;
  link.download=noteImage.name;
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
el('save-note').onclick=saveNote;
el('print-note').onclick=()=>window.print();
el('share-note').onclick=async()=>{
  const payload={files:[noteImage],title:'Minha notinha do Realejo'};
  if(navigator.canShare?.(payload)){
    try{await navigator.share(payload);return}
    catch(error){if(error.name==='AbortError')return}
  }
  saveNote();
  el('note-status').textContent='Imagem salva para você compartilhar.';
};
if(location.hash.startsWith('#n=')){try{receive(decode(location.hash.slice(3)))}catch{el('home').querySelector('p').textContent='Este link de notinha está incompleto. Você pode criar outro cartão.'}}
</script></html>
