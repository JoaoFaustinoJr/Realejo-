let noteImage;
function wrappedLines(ctx,text,maxWidth){
  const rows=[];
  for(const paragraph of text.split('\n')){
    let row='';
    for(const word of paragraph.split(' ')){
      const next=row?row+' '+word:word;
      if(ctx.measureText(next).width<=maxWidth){row=next;continue}
      if(row)rows.push(row);
      row='';
      for(const char of word){
        if(row&&ctx.measureText(row+char).width>maxWidth){rows.push(row);row=''}
        row+=char;
      }
    }
    rows.push(row);
  }
  return rows;
}
async function buildNoteImage(message,signatureText){

    canvas.width=1080;

    ctx.font='49px Georgia, serif';
    const rows=wrappedLines(ctx,message,888);
    ctx.font='italic 35px Georgia, serif';
    const signature=signatureText?wrappedLines(ctx,signatureText,888):[];
    canvas.height=Math.max(680,270+rows.length*65+signature.length*48);
    const gradient=ctx.createLinearGradient(0,0,1080,canvas.height);
    gradient.addColorStop(0,'#343125');
    gradient.addColorStop(1,'#171e1d');
    ctx.fillStyle=gradient;
    ctx.fillRect(0,0,1080,canvas.height);
    ctx.strokeStyle='#9d8252';
    ctx.lineWidth=2;
    ctx.strokeRect(28,28,1024,canvas.height-56);
    ctx.save();
    ctx.beginPath();
    ctx.arc(146,139,49,0,Math.PI*2);
    ctx.clip();
    const crop=Math.min(portrait.naturalWidth,portrait.naturalHeight);
    ctx.drawImage(portrait,(portrait.naturalWidth-crop)*.62,(portrait.naturalHeight-crop)/2,crop,crop,97,90,98,98);
    ctx.restore();
    ctx.fillStyle='#e2c68f';
    ctx.font='bold 28px Georgia, serif';
    ctx.fillText('R E A L E J O',216,149);
    ctx.fillRect(96,213,888,1);
    ctx.fillStyle='#f3e6ca';
    ctx.font='49px Georgia, serif';
    rows.forEach((row,i)=>ctx.fillText(row,96,285+i*65));
    ctx.fillStyle='#e2c68f';
    ctx.font='italic 35px Georgia, serif';
    signature.forEach((row,i)=>ctx.fillText(row,96,294+rows.length*65+i*48));

    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
    if(!blob)throw Error();
    return new File([blob],'notinha-realejo.png',{type:'image/png'});

}
